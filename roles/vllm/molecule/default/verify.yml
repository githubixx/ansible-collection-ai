---
- name: Verify vLLM installation
  hosts: all
  become: true
  gather_facts: true
  vars:
    vllm_test_version: "0.30.0"
    vllm_test_accelerator: "{{ 'amd_rocm' if 'amd_rocm' in group_names else 'nvidia_cuda' }}"
  tasks:
    - name: Query vLLM service user
      ansible.builtin.getent:
        database: passwd
        key: vllm

    - name: Gather vLLM installation metadata
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/vllm/venv/bin/python
        - /opt/vllm/venv/bin/vllm
        - /opt/vllm/venv/.githubixx-ai-accelerator
        - /etc/systemd/system/vllm.service
        - /var/lib/vllm/cache
        - /var/lib/vllm/models
      register: vllm_test_files

    - name: Assert vLLM installation files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
      loop: "{{ vllm_test_files.results }}"

    - name: Query vLLM virtual environment Python
      become: true
      become_user: vllm
      ansible.builtin.command:
        argv:
          - /opt/vllm/venv/bin/python
          - --version
      register: vllm_test_python_version
      changed_when: false

    - name: Assert Python 3.12 is used
      ansible.builtin.assert:
        that:
          - vllm_test_python_version.stdout is match('^Python 3\\.12\\.')

    - name: Query vLLM version
      become: true
      become_user: vllm
      ansible.builtin.command:
        argv:
          - /opt/vllm/venv/bin/python
          - -c
          - "from importlib.metadata import version; print(version('vllm'))"
      register: vllm_test_version_query
      changed_when: false

    - name: Assert expected vLLM version is installed
      ansible.builtin.assert:
        that:
          - vllm_test_version in vllm_test_version_query.stdout

    - name: Check vLLM dependency consistency
      become: true
      become_user: vllm
      ansible.builtin.command:
        argv:
          - uv
          - pip
          - check
          - --python
          - /opt/vllm/venv/bin/python
      changed_when: false

    - name: Query PyTorch backend metadata without loading GPU libraries
      become: true
      become_user: vllm
      ansible.builtin.command:
        argv:
          - /opt/vllm/venv/bin/python
          - -c
          - >-
            import ast, json;
            from importlib.metadata import distribution;
            version_file = distribution('torch').locate_file('torch/version.py');
            assignments = ast.parse(version_file.read_text()).body;
            backend = {
            target.id: ast.literal_eval(assignment.value)
            for assignment in assignments
            if isinstance(assignment, (ast.Assign, ast.AnnAssign))
            for target in (assignment.targets if isinstance(assignment, ast.Assign) else [assignment.target])
            if isinstance(target, ast.Name) and target.id in ('hip', 'cuda')
            };
            print(json.dumps(backend))
      register: vllm_test_torch_backend
      changed_when: false

    - name: Assert the AMD profile installed ROCm wheels
      when: vllm_test_accelerator == 'amd_rocm'
      ansible.builtin.assert:
        that:
          - "'+rocm723' in vllm_test_version_query.stdout"
          - (vllm_test_torch_backend.stdout | from_json).hip | default('', true) | length > 0
          - (vllm_test_torch_backend.stdout | from_json).cuda is none
        fail_msg: >-
          Expected vLLM ROCm 7.2.3 and HIP-enabled PyTorch with no CUDA backend.
          vLLM version: {{ vllm_test_version_query.stdout }};
          PyTorch backend metadata: {{ vllm_test_torch_backend.stdout }}.

    - name: Read vLLM accelerator marker
      ansible.builtin.slurp:
        src: /opt/vllm/venv/.githubixx-ai-accelerator
      register: vllm_test_accelerator_marker

    - name: Assert expected vLLM accelerator profile is installed
      ansible.builtin.assert:
        that:
          - (vllm_test_accelerator_marker.content | b64decode | trim) == vllm_test_accelerator

    - name: Gather vLLM cache directory metadata
      ansible.builtin.stat:
        path: /var/lib/vllm/cache
      register: vllm_test_cache_directory

    - name: Assert vLLM cache directory is owned by service user
      ansible.builtin.assert:
        that:
          - vllm_test_cache_directory.stat.pw_name == 'vllm'
          - vllm_test_cache_directory.stat.gr_name == 'vllm'

    - name: Read vLLM systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/vllm.service
      register: vllm_test_unit

    - name: Assert vLLM systemd unit configuration
      ansible.builtin.assert:
        that:
          - "'User=vllm' in (vllm_test_unit.content | b64decode)"
          - >-
            'ExecStart=/opt/vllm/venv/bin/vllm serve
            Qwen/Qwen2.5-1.5B-Instruct --host 127.0.0.1 --port 8000'
            in (vllm_test_unit.content | b64decode)
          - "'EnvironmentFile=' not in (vllm_test_unit.content | b64decode)"

    - name: Gather vLLM service facts
      ansible.builtin.service_facts:

    - name: Assert vLLM service is disabled and stopped
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['vllm.service']['state'] in ['inactive', 'stopped']
          - ansible_facts['services']['vllm.service']['status'] == 'disabled'
