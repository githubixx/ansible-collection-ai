---
dependency:
  name: galaxy
  options:
    roles-path: "${MOLECULE_PROJECT_DIRECTORY}/../../.molecule/roles"

driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: test-openshell-ubuntu2404
    box: githubixx/ubuntu-24.04
    memory: 2048
    cpus: 2
    groups:
      - ubuntu
  - name: test-openshell-ubuntu2604
    box: githubixx/ubuntu-26.04
    memory: 2048
    cpus: 2
    groups:
      - ubuntu
  - name: test-openshell-archlinux
    box: githubixx/archlinux
    memory: 2048
    cpus: 2
    groups:
      - archlinux

provisioner:
  name: ansible
  connection_options:
    ansible_ssh_user: vagrant
    ansible_become: true
  config_options:
    defaults:
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/..:${MOLECULE_PROJECT_DIRECTORY}/../../.molecule/roles"
  lint:
    name: ansible-lint

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
