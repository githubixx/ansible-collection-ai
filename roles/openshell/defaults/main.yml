---
# NVIDIA OpenShell release to install. Keep the CLI and gateway on the same release.
openshell_version: "0.0.104"

# This role currently supports the x86_64 release artifacts only.
openshell_arch: "{{ ansible_facts['architecture'] }}"
openshell_upstream_arch: "x86_64"

openshell_download_directory: "{{ ansible_facts['env']['TMPDIR'] | default('/tmp', true) }}/openshell"
openshell_binary_mode: "0755"

openshell_cli_archive: "openshell-{{ openshell_upstream_arch }}-unknown-linux-musl.tar.gz"
openshell_gateway_archive: "openshell-gateway-{{ openshell_upstream_arch }}-unknown-linux-gnu.tar.gz"
openshell_release_url: "https://github.com/NVIDIA/OpenShell/releases/download/v{{ openshell_version }}"
openshell_cli_url: "{{ openshell_release_url }}/{{ openshell_cli_archive }}"
openshell_gateway_url: "{{ openshell_release_url }}/{{ openshell_gateway_archive }}"
openshell_cli_checksum: "sha256:a8db262ad9af996a3d9203fcc3d7ba90fe2c6cb0f3fffc9b7d1b9b44cd27df22"
openshell_gateway_checksum: "sha256:577fc5cb9ef64bc0c1afc9b8fc85cdfe9ef546ebf40794085b31d78200928bb1"

# The local gateway runs as Ansible's connection user. Override when OpenShell
# should be available to another user.
openshell_user: "{{ ansible_user | default(ansible_facts['user_id']) }}"
openshell_bin_directory: "{{ _openshell_user_home }}/.local/bin"
openshell_owner: "{{ openshell_user }}"
openshell_group: "{{ _openshell_user_group }}"
openshell_gateway_service_name: "openshell-gateway.service"
openshell_gateway_config_directory_name: ".config/openshell"
openshell_gateway_state_directory_name: ".local/state/openshell"
openshell_gateway_config_mode: "0640"
openshell_gateway_state_mode: "0700"
openshell_gateway_service_enabled: true
openshell_gateway_service_started: true

# Docker is deliberately not installed by this role. The target user must be
# able to access the Docker socket and Docker is used by the default gateway
# configuration.
openshell_compute_driver: "docker"
openshell_gateway_bind_address: "127.0.0.1:17670"
openshell_gateway_name: "openshell"
