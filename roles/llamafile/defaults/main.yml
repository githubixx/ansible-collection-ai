# Models to install. Each item requires `name`, `id`, and `run_mode`.
# Use `server` for a systemd service, or `combined` for an interactive launcher.
# Items may override catalog `filename`, `url`, and `checksum` for a mirror.
llamafile_models: []

# Required host architecture; this role supports only x86_64 llamafile bundles.
llamafile_arch: "{{ ansible_facts['architecture'] }}"
# Dedicated system account that runs server-mode model processes.
llamafile_user: "llamafile"
# Primary group for `llamafile_user` and writable runtime directories.
llamafile_group: "llamafile"
# Service account home; contains mutable runtime, cache, and download state.
llamafile_home: "/var/lib/llamafile"
# Root-owned directory containing completed executable model bundles.
llamafile_artifact_directory: "/opt/llamafile/models"
# Writable temporary directory used by the service and llamafile loader.
llamafile_runtime_directory: "{{ llamafile_home }}/runtime"
# Writable HOME-level cache directory for dynamically built GPU libraries.
llamafile_cache_directory: "{{ llamafile_home }}/.llamafile"
# Directory retaining resumable `*.part` downloads between playbook runs.
llamafile_download_directory: "{{ llamafile_home }}/downloads"
# Directory containing persistent curl stderr/progress logs for each model.
llamafile_download_log_directory: "{{ llamafile_home }}/download-logs"
# Directory for root-owned launchers of interactive combined-mode models.
llamafile_combined_launcher_directory: "/usr/local/bin"

# Number of curl retries after a transient download failure.
llamafile_download_retries: 5
# Seconds curl waits between download retries.
llamafile_download_retry_delay: 15
# Maximum seconds curl waits to establish each remote connection.
llamafile_download_connect_timeout: 30
# Maximum seconds Ansible permits one background transfer to run.
llamafile_download_async_timeout: 86400
# Seconds between Ansible checks of each background transfer's completion.
llamafile_download_poll_interval: 30
# Remove an existing partial file before download instead of attempting resume.
llamafile_download_cleanup_partial: false

# Number of attempts to wait for a started loopback server health endpoint.
llamafile_healthcheck_retries: 12
# Seconds between loopback server health endpoint attempts.
llamafile_healthcheck_delay: 5
# HTTP path queried on started loopback server instances.
llamafile_healthcheck_path: "/health"
