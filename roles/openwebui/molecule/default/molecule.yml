---
dependency:
  name: galaxy

driver:
  name: vagrant
  provider:
    name: libvirt
    type: libvirt

platforms:
  - name: test-openwebui-ubuntu2404
    box: githubixx/ubuntu-24.04
    memory: 4096
    cpus: 2
    provider_raw_config_args:
      - "machine_virtual_size = 24"
    groups:
      - ubuntu
  - name: test-openwebui-ubuntu2604
    box: githubixx/ubuntu-26.04
    memory: 4096
    cpus: 2
    provider_raw_config_args:
      - "machine_virtual_size = 24"
    groups:
      - ubuntu
  - name: test-openwebui-archlinux
    box: githubixx/archlinux
    memory: 4096
    cpus: 2
    provider_raw_config_args:
      - "machine_virtual_size = 24"
    groups:
      - archlinux

provisioner:
  name: ansible
  connection_options:
    ansible_ssh_user: vagrant
    ansible_become: true
  config_options:
    defaults:
      roles_path: /opt/scripts/ansible/collections/githubixx/ai/roles:/opt/scripts/ansible/roles
  lint:
    name: ansible-lint

scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
