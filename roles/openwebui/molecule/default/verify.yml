---
- name: Verify Open WebUI installation
  hosts: all
  become: true
  gather_facts: true
  vars:
    openwebui_test_version: "0.11.4"
  tasks:
    - name: Query Open WebUI service user
      ansible.builtin.getent:
        database: passwd
        key: openwebui

    - name: Gather Open WebUI installation metadata
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /opt/openwebui/venv/bin/python
        - /opt/openwebui/venv/bin/open-webui
        - /etc/systemd/system/openwebui.service
        - /var/lib/openwebui/data
      register: openwebui_test_files

    - name: Assert Open WebUI installation files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
      loop: "{{ openwebui_test_files.results }}"

    - name: Query Open WebUI virtual environment Python
      become: true
      become_user: openwebui
      ansible.builtin.command:
        argv:
          - /opt/openwebui/venv/bin/python
          - --version
      register: openwebui_test_python_version
      changed_when: false

    - name: Assert Python 3.11 is used
      ansible.builtin.assert:
        that:
          - openwebui_test_python_version.stdout is match('^Python 3\\.11\\.')

    - name: Query Open WebUI version
      become: true
      become_user: openwebui
      ansible.builtin.command:
        argv:
          - /opt/openwebui/venv/bin/python
          - -c
          - "from importlib.metadata import version; print(version('open-webui'))"
      register: openwebui_test_version_query
      changed_when: false

    - name: Assert expected Open WebUI version is installed
      ansible.builtin.assert:
        that:
          - openwebui_test_version == openwebui_test_version_query.stdout

    - name: Check Open WebUI dependency consistency
      become: true
      become_user: openwebui
      ansible.builtin.command:
        argv:
          - uv
          - pip
          - check
          - --python
          - /opt/openwebui/venv/bin/python
      changed_when: false

    - name: Query preserved Open WebUI upgrade database sentinel
      become: true
      become_user: openwebui
      ansible.builtin.command:
        argv:
          - /opt/openwebui/venv/bin/python
          - -c
          - >-
            import sqlite3;
            database = sqlite3.connect('file:/var/lib/openwebui/data/webui.db?mode=ro', uri=True);
            print(database.execute('SELECT value FROM molecule_upgrade_sentinel').fetchone()[0]);
            database.close()
      register: openwebui_test_upgrade_database
      changed_when: false

    - name: Read preserved Open WebUI persistent file sentinel
      ansible.builtin.slurp:
        src: /var/lib/openwebui/data/molecule-upgrade-sentinel
      register: openwebui_test_upgrade_file

    - name: Read Open WebUI test environment file
      ansible.builtin.slurp:
        src: /etc/openwebui/openwebui.env
      register: openwebui_test_environment

    - name: Assert Open WebUI upgrade retained data and secret
      ansible.builtin.assert:
        that:
          - openwebui_test_upgrade_database.stdout == 'preserved'
          - (openwebui_test_upgrade_file.content | b64decode | trim) == 'preserved'
          - "'WEBUI_SECRET_KEY=molecule-test-secret-key' in (openwebui_test_environment.content | b64decode)"

    - name: Gather Open WebUI data directory metadata
      ansible.builtin.stat:
        path: /var/lib/openwebui/data
      register: openwebui_test_data_directory

    - name: Assert Open WebUI data directory is owned by service user
      ansible.builtin.assert:
        that:
          - openwebui_test_data_directory.stat.pw_name == 'openwebui'
          - openwebui_test_data_directory.stat.gr_name == 'openwebui'

    - name: Read Open WebUI systemd unit
      ansible.builtin.slurp:
        src: /etc/systemd/system/openwebui.service
      register: openwebui_test_unit

    - name: Assert Open WebUI service unit configuration
      ansible.builtin.assert:
        that:
          - "'User=openwebui' in (openwebui_test_unit.content | b64decode)"
          - "'EnvironmentFile=/etc/openwebui/openwebui.env' in (openwebui_test_unit.content | b64decode)"
          - "'\nRestart=always\n' in (openwebui_test_unit.content | b64decode)"
          - "'--host 127.0.0.1 --port 8080' in (openwebui_test_unit.content | b64decode)"

    - name: Gather Open WebUI service facts
      ansible.builtin.service_facts:

    - name: Assert Open WebUI service is running
      ansible.builtin.assert:
        that:
          - ansible_facts['services']['openwebui.service']['state'] == 'running'
          - ansible_facts['services']['openwebui.service']['status'] == 'enabled'

    - name: Query Open WebUI loopback UI
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/
        status_code: 200
      changed_when: false
