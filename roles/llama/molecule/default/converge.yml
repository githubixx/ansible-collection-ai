    llama_artifact_url: >-
      https://huggingface.co/buckets/ggml-org/install.sh/resolve/b12110/x86_64/linux/cpu/ylkkk/llama-app.zst
    llama_artifact_checksum: "sha256:c941fccbdd12742962f5307a785518f1090b585621cb6a87fc745bd629442f2b"
  tasks:
    - name: Include llama
      ansible.builtin.include_role:
        name: llama
