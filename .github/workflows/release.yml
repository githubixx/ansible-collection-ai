# This workflow requires a GALAXY_API_KEY secret in the GitHub repository or
# organization. Tags must match the collection version; manual runs publish
# the version from the selected branch.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'
      - '*.*.*-*'

defaults:
  run:
    shell: bash
    working-directory: .

permissions:
  contents: write

jobs:
  release:
    name: Release collection
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible Core
        run: python -m pip install ansible-core

      - name: Verify collection version
        run: |
          collection_version=$(python -c 'import yaml; print(yaml.safe_load(open("galaxy.yml"))["version"])')

          test -n "${collection_version}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${GITHUB_REF_TYPE}" = "tag"
            test "${GITHUB_REF_NAME}" = "${collection_version}"
          fi

          echo "COLLECTION_VERSION=${collection_version}" >> "${GITHUB_ENV}"
          echo "COLLECTION_ARTIFACT=dist/githubixx-ai-${collection_version}.tar.gz" >> "${GITHUB_ENV}"

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1

      - name: Build collection
        run: ansible-galaxy collection build --force --output-path dist

      - name: Generate release notes
        run: |
          if git rev-parse --verify --quiet "refs/tags/${COLLECTION_VERSION}"; then
            git-cliff --config cliff.toml --latest --strip header --output release-notes.md
          else
            git-cliff --config cliff.toml --unreleased --tag "${COLLECTION_VERSION}" \
              --strip header --output release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${COLLECTION_VERSION}" >/dev/null 2>&1; then
            gh release edit "${COLLECTION_VERSION}" --title "${COLLECTION_VERSION}" \
              --notes-file release-notes.md
          else
            gh release create "${COLLECTION_VERSION}" --target "${GITHUB_SHA}" \
              --title "${COLLECTION_VERSION}" --notes-file release-notes.md
          fi

          gh release upload "${COLLECTION_VERSION}" "${COLLECTION_ARTIFACT}" --clobber

      - name: Publish collection to Ansible Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: ansible-galaxy collection publish "${COLLECTION_ARTIFACT}" --api-key "${GALAXY_API_KEY}"
